[project]
name = "sentinela-ml-service"
version = "0.1.0"
description = "Servicio FastAPI de scoring tabular de riesgo para Sentinela."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "shap>=0.46",
  "joblib>=1.4"
]

[project.optional-dependencies]
test = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
