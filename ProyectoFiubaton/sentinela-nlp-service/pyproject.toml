[project]
name = "sentinela-nlp-service"
version = "0.1.0"
description = "Servicio FastAPI de analisis semantico longitudinal para Sentinela."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "numpy>=1.26"
]

[project.optional-dependencies]
test = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
